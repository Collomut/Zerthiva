services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: zerthiva_timescaledb
    environment:
      POSTGRES_USER: zerthiva_user
      POSTGRES_PASSWORD: zerthiva_pass
      POSTGRES_DB: zerthiva_db
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerthiva_user -d zerthiva_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zerthiva_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://zerthiva_user:zerthiva_pass@timescaledb:5432/zerthiva_db
      SECRET_KEY: zerthiva-super-secret-key-change-in-production-min-32-chars
      DEVICE_PSK: sg-field-device-pre-shared-key-2026
      ENVIRONMENT: production
      DEBUG: "False"
      SMS_PROVIDER: mock
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zerthiva_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: zerthiva_simulator
    environment:
      API_ENDPOINT: http://backend:8000/api/v1/ingest/telemetry
      DEVICE_PSK: sg-field-device-pre-shared-key-2026
      INTERVAL_SECONDS: 10
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  timescaledb_data:
